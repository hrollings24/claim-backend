name: Build and Push to ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write # required for OIDC
  contents: read

# TODO: restore the "Update Lambda function code" step (and rename this file/job back to
# "deploy") once the Lambda function exists in AWS. It doesn't yet — this workflow is
# temporarily ECR-push-only to seed the first image, unblocking `terraform apply` for
# aws_lambda_function.backend in claim-infrastructure/lambda.tf.
env:
  ECR_REPOSITORY: claim-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f dockerfile-lambda \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
